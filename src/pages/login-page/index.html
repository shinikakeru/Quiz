<!DOCTYPE html>
<html lang = "ru">
<head>
    <meta charset="UTF-8">
    <title>Логин</title>
    <link rel="icon" id="favicon-link" href="/public/lane.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body">

    <div class="header-container">
        <header class="header">
                <a href="../welcome-page/">Назад</a>
        </header>
    </div>

    <main class="main">
        <div class="main-form">
            <h1 class="form-title">Вход</h1>
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="login">Логин или почта</label>
                    <input type="text" id="login" name="login" placeholder="Введите логин или почту" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" minlength="6" required>
                </div>

                <button type="submit" class="submit-btn">Войти</button>
            </form>
            <p class="form-footer-text">
                Нет аккаунта? <a href="../register-page/" class="inline-link">Зарегистрироваться</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>Мой пет проект</p>
    </footer>
    
</body>
<script type="module" src="../../data/auth.js"></script>
<script type = "module" src="./login.js"></script>
</html>
